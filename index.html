<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 - Conexión Universal Dinámica</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; background-color: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .status { font-weight: bold; padding: 10px 16px; border-radius: 6px; display: inline-block; margin-bottom: 20px; font-size: 0.9rem; }
        .disconnected { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .connected { background-color: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
        h1 { font-size: 3rem; margin: 10px 0; color: #38bdf8; }
        button { padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; background-color: #2563eb; color: white; border: none; border-radius: 6px; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Panel de Telemetría ESP32</h2>
        <div id="status" class="status disconnected">ESTADO: BUSCANDO CONEXIÓN...</div>
        <p>Contador en Tiempo Real:</p>
        <h1 id="counter">--</h1>
        <p>Estado del Servidor: <span id="msg" style="color: #94a3b8;">Esperando datos...</span></p>
        <br>
        <button onclick="enviarMensaje()">Enviar Comando al ESP32</button>
    </div>

    <script>
        let ws;

        function conectar() {
            // MAGIA DINÁMICA: Toma automáticamente el hostname actual (sea IP, dominio o esp32.local)[cite: 1]
            // Si abres la página web desde cualquier red, se conectará al puerto 81 de ese mismo host de forma nativa.
            const targetHost = window.location.hostname || "esp32.local";
            const wsUri = "ws://" + targetHost + ":81/";
            
            console.log("Conectando de forma dinámica a: " + wsUri);
            ws = new WebSocket(wsUri);

            ws.onopen = function() {
                let statusEl = document.getElementById("status");
                statusEl.className = "status connected";
                statusEl.innerText = "ESTADO: CONECTADO UNIVERSALMENTE";
            };

            ws.onclose = function() {
                let statusEl = document.getElementById("status");
                statusEl.className = "status disconnected";
                statusEl.innerText = "ESTADO: DESCONECTADO (Reintentando...)";
                // Intenta reconectar automáticamente cada 3 segundos si cambia de red o pierde señal
                setTimeout(conectar, 3000);
            };

            ws.onerror = function(error) {
                console.error("Error en socket:", error);
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                document.getElementById("counter").innerText = data.contador;
                document.getElementById("msg").innerText = data.mensaje;
            };
        }

        function enviarMensaje() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send("Comando ejecutado desde la interfaz web universal.");
                alert("Comando enviado con éxito.");
            } else {
                alert("No hay conexión activa con la placa.");
            }
        }

        // Iniciar al cargar la ventana
        window.onload = conectar;
    </script>
</body>
</html>
