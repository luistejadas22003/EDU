<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión ESP32</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status { font-weight: bold; padding: 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .disconnected { background-color: #ffdddd; color: #d8000c; }
        .connected { background-color: #dff2bf; color: #4F8A10; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Prueba de Comunicación WebSocket</h2>
        <div id="status" class="status disconnected">ESTADO: DESCONECTADO</div>
        <p>Contador recibido del ESP32: <h1 id="counter">--</h1></p>
        <p>Mensaje: <span id="msg">Esperando...</span></p>
        <br>
        <button onclick="enviarMensaje()">Enviar Saludo al ESP32</button>
    </div>

    <script>
        let ws;

        function conectar() {
            // Detecta automáticamente si abres por IP o por esp32.local[cite: 1]
            const host = window.location.hostname || "esp32.local";
            const wsUri = "ws://" + host + ":81/";
            
            console.log("Intentando conectar a: " + wsUri);
            ws = new WebSocket(wsUri);

            ws.onopen = function() {
                let statusEl = document.getElementById("status");
                statusEl.className = "status connected";
                statusEl.innerText = "ESTADO: CONECTADO CORRECTAMENTE";
                console.log("WebSocket conectado");
            };

            ws.onclose = function() {
                let statusEl = document.getElementById("status");
                statusEl.className = "status disconnected";
                statusEl.innerText = "ESTADO: DESCONECTADO (Reintentando...)";
                console.log("WebSocket cerrado. Reintentando en 3 segundos...");
                setTimeout(conectar, 3000);
            };

            ws.onerror = function(error) {
                console.error("Error en WebSocket:", error);
            };

            ws.onmessage = function(event) {
                console.log("Mensaje recibido: ", event.data);
                const data = JSON.parse(event.data);
                document.getElementById("counter").innerText = data.contador;
                document.getElementById("msg").innerText = data.mensaje;
            };
        }

        function enviarMensaje() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send("¡Hola ESP32, te saludo desde la web!");
                alert("Mensaje enviado al ESP32. Revisa el Monitor Serie.");
            } else {
                alert("No hay conexión activa con el ESP32.");
            }
        }

        // Iniciar conexión al cargar la página
        window.onload = conectar;
    </script>
</body>
</html>
